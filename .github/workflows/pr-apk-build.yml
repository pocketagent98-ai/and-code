name: PR APK Build

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'build-apk' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          CMDLINE="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | sort -V | tail -1)"
          echo "Using cmdline-tools: $CMDLINE"
          echo "$CMDLINE" >> "$GITHUB_PATH"
          yes | "$CMDLINE/sdkmanager" --licenses >/dev/null || true
          "$CMDLINE/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Provide signing keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Using the stored release keystore"
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          else
            echo "No stored keystore; generating one"
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/release.keystore" \
              -storetype JKS \
              -storepass andcode -keypass andcode \
              -alias andcode -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=AndCode Custom, O=AndCode, C=IN"
          fi
      - name: Build signed release APK
        env:
          AND_CODE_STORE_FILE: ${{ runner.temp }}/release.keystore
          AND_CODE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || 'andcode' }}
          AND_CODE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'andcode' }}
          AND_CODE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'andcode' }}
          GITHUB_CLIENT_ID: ${{ vars.AND_CODE_GITHUB_CLIENT_ID }}
        run: ./gradlew :app:assembleGithubRelease
      - name: Upload signing keystore
        uses: actions/upload-artifact@v4
        with:
          name: andcode-keystore
          path: ${{ runner.temp }}/release.keystore
          retention-days: 7
      - id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: and-code-release-apk
          path: app/build/outputs/apk/github/release/app-github-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Comment or update APK link on PR
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const artifactUrl = '${{ steps.upload-apk.outputs.artifact-url }}';
            let prNumber = context.payload.pull_request?.number;
            if (!prNumber) {
              const branch = context.ref.replace(/^refs\/heads\//, '');
              const { data: prs } = await github.rest.pulls.list({
                owner, repo, head: `${owner}:${branch}`, state: 'all', per_page: 1,
              });
              prNumber = prs[0]?.number;
            }
            if (!prNumber) {
              core.info('No associated pull request found; skipping comment.');
              return;
            }
            const marker = '<!-- and-code-debug-apk -->';
            const body = [
              marker,
              '**Release APK built successfully**',
              '',
              `[Download APK artifact](${artifactUrl})`,
              `[View workflow run](https://github.com/${owner}/${repo}/actions/runs/${context.runId})`,
              '',
              `Commit: \`${context.sha.slice(0, 12)}\` | Artifact expires in 14 days.`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const existing = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }
